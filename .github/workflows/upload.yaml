name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: corepack enable
    - uses: calcit-lang/setup-calcit@v1
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"
    - run: caps --strict --ci
    - run: yarn install --immutable
    - name: Check current Calcit code
      run: |
        caps verify --toolchain
        calcit edit format
        git diff --exit-code -- calcit.cirru
        calcit --check-only --all-defs --format json
        calcit --check-only --ns app.browser --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --summary-only
        calcit test --require-match
    - run: yarn compile && yarn build

    - name: Deploy to server
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v1.1.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
